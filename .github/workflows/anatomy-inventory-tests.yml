name: Anatomy asset tooling checks

on:
  push:
    paths:
      - 'Tools/anatomy_tools/**'
      - 'Assets-Manifest/arm_bone_mapping.template.json'
      - '.github/workflows/anatomy-inventory-tests.yml'
  pull_request:
    paths:
      - 'Tools/anatomy_tools/**'
      - 'Assets-Manifest/arm_bone_mapping.template.json'
      - '.github/workflows/anatomy-inventory-tests.yml'

jobs:
  anatomy-tools-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m compileall -q Tools/anatomy_tools
      - name: Name hint tests (stdlib)
        run: python -m unittest discover -s Tools/anatomy_tools/tests -v
      - name: Mapping JSON shape
        run: |
          python -m json.tool Assets-Manifest/arm_bone_mapping.template.json >/dev/null
          python - <<'PY'
          import json
          with open("Assets-Manifest/arm_bone_mapping.template.json") as f:
              data = json.load(f)
          assert len(data["bones"]) == 6
          assert all(not x["verified"] and x["localStart"] is None
                     and x["localEnd"] is None for x in data["bones"])
          print("Unverified anchors correctly remain unset.")
          PY
      - name: Scope
        run: echo "No Blender FBX imports, Unity compile, or real camera rendering are tested here."
