name: Foundation and standalone repository checks

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'Unity/**'
      - 'Tools/**'
      - 'Assets-Manifest/**'
      - 'Docs/**'
      - 'README.md'
      - '.gitignore'
      - 'scripts/**'
      - '.github/workflows/foundation-check.yml'
  pull_request:
    paths:
      - 'Unity/**'
      - 'Tools/**'
      - 'Assets-Manifest/**'
      - 'Docs/**'
      - 'README.md'
      - '.gitignore'
      - 'scripts/**'
      - '.github/workflows/foundation-check.yml'

jobs:
  check-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Unity project and asset manifest
        run: |
          python -m json.tool Unity/Packages/manifest.json >/dev/null
          python -m json.tool Assets-Manifest/asset_sources.json >/dev/null
          test -s Unity/ProjectSettings/ProjectVersion.txt
          test -s Unity/Assets/Scripts/Tracking/PoseStreamReceiver.cs
          test -s Unity/Assets/Scripts/Motion/FullBodyAtlasRetargeter.cs
          grep -q '6000.3.27f2' Unity/ProjectSettings/ProjectVersion.txt
      - name: Run repository hygiene unit tests
        run: python -m unittest discover -s Tools/ci/tests -v
      - name: Assert no legacy pose engine or bundled historical assets
        run: |
          python Tools/ci/check_mediapipe_only.py
          python Tools/ci/check_clean_repo.py
      - name: Python syntax
        run: python -m compileall -q Tools/anatomy_tools
      - name: Name hint tests (stdlib)
        run: python -m unittest discover -s Tools/anatomy_tools/tests -v
      - name: Mapping JSON shape
        run: |
          python -m json.tool Assets-Manifest/arm_bone_mapping.template.json >/dev/null
          python - <<'PY'
          import json
          with open("Assets-Manifest/arm_bone_mapping.template.json") as f:
              data = json.load(f)
          assert len(data["bones"]) == 6
          assert all(not x["verified"] and x["localStart"] is None
                     and x["localEnd"] is None for x in data["bones"])
          print("Unverified anchors correctly remain unset.")
          PY
      - name: Check non-destructive whole-atlas source architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          base = Path("Unity/Assets")
          profile = (base / "Scripts/Anatomy/FullBodyAtlasProfile.cs").read_text()
          runtime = (base / "Scripts/Motion/FullBodyAtlasRetargeter.cs").read_text()
          scene = (base / "Editor/Phase4FullBodySceneBuilder.cs").read_text()
          setup = (base / "Editor/FullBodyAtlasSetupWindow.cs").read_text()
          required = {
              "one full prefab": "wholeSkeletonPrefab" in profile and "Instantiate(profile.wholeSkeletonPrefab" in runtime,
              "rest pose preserved": "neutralAtlasPosition" in runtime and "originalLocalRotation" in runtime,
              "hierarchy paths retained": "rendererRootPaths" in runtime and "RelativePath(" in setup,
              "existing AR compositor reused": "Phase3XRaySceneBuilder" in scene,
              "body pose solver": "TrySegment" in (base / "Scripts/Motion/FullBodyPoseMath.cs").read_text(),
              "schematic demo": "Create Full Body Schematic Demo" in scene,
              "shoulder registration": "AtlasRegistrationMath.TrySolve" in runtime,
              "safe hierarchy resolver": "AtlasHierarchyPath.TryResolve" in runtime and "AtlasHierarchyPath.TryResolve" in profile,
              "indexed paths in UI": "AtlasHierarchyPath.RelativePath" in setup,
              "visual anchor editing": (base / "Editor/FullBodyAtlasCalibrationWindow.cs").exists(),
              "registration math self-check": (base / "Editor/AtlasRegistrationSelfCheck.cs").exists(),
              "filter module": "dropoutGraceSeconds" in (base / "Scripts/Motion/FullBodyPoseSmoother.cs").read_text(),
              "smoother in retargeter": "poseSmoother.TrySegment" in runtime and "poseSmoother.TryShoulders" in runtime,
              "fail-closed hierarchy": "ValidateHierarchy" in runtime and "Overlapping atlas subtree" in profile,
              "focus rendering modes": "ApplyViewMode" in runtime and "ArmsOnly" in runtime,
              "editor smoke checks": (base / "Editor/FullBodyStabilitySelfCheck.cs").exists(),
          }
          for name, ok in required.items():
              print(name, "OK" if ok else "MISSING")
          assert all(required.values())
          print("Static source contracts only — NOT Unity compile/runtime tests.")
          PY
      - name: Scope disclaimer
        run: echo 'Static source hygiene only. No Unity Editor or webcam validation occurs here.'

  clean-export-smoke:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create entirely new Git repository from clean source snapshot
        run: |
          git config --global user.name "MagicMirror Migration CI"
          git config --global user.email "74452488+Kevoyuan@users.noreply.github.com"
          bash scripts/create_standalone_repo.sh "$RUNNER_TEMP/MagicMirror-2.0"
      - name: Prove new history has one commit and no historical files
        run: |
          test "$(git -C "$RUNNER_TEMP/MagicMirror-2.0" rev-list --count HEAD)" = "1"
          test "$(git -C "$RUNNER_TEMP/MagicMirror-2.0" symbolic-ref --short HEAD)" = "main"
          test -z "$(git -C "$RUNNER_TEMP/MagicMirror-2.0" remote)"
          test ! -d "$RUNNER_TEMP/MagicMirror-2.0/OpenPosePlugin"
          test ! -d "$RUNNER_TEMP/MagicMirror-2.0/model_for_test"
          test ! -e "$RUNNER_TEMP/MagicMirror-2.0/ikun_demo.gif"
          python "$RUNNER_TEMP/MagicMirror-2.0/Tools/ci/check_clean_repo.py"
          python "$RUNNER_TEMP/MagicMirror-2.0/Tools/ci/check_mediapipe_only.py"
          echo "PASS: independent main-only Git history created from clean source."
