name: Foundation checks

on:
  push:
    paths:
      - 'Unity/**'
      - 'Assets-Manifest/**'
      - 'Docs/**'
      - 'README.md'
      - 'README_V2.md'
      - 'README_ANATOMY_IMPORT.md'
      - 'Tools/pose_sidecar/**'
      - 'Tools/ci/**'
      - '.github/workflows/foundation-check.yml'
  pull_request:
    paths:
      - 'Unity/**'
      - 'Assets-Manifest/**'
      - 'Docs/**'
      - 'README.md'
      - 'README_V2.md'
      - 'README_ANATOMY_IMPORT.md'
      - 'Tools/pose_sidecar/**'
      - 'Tools/ci/**'
      - '.github/workflows/foundation-check.yml'

jobs:
  check-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and project scaffold
        run: |
          python3 -m json.tool Unity/Packages/manifest.json >/dev/null
          python3 -m json.tool Assets-Manifest/asset_sources.json >/dev/null
          test -s Unity/ProjectSettings/ProjectVersion.txt
          test -s Unity/Assets/Scripts/Camera/WebcamPreviewController.cs
          test -s Unity/Assets/Editor/Phase0SceneBuilder.cs
          grep -q '6000.3.27f2' Unity/ProjectSettings/ProjectVersion.txt
      - name: Assert active runtime is MediaPipe-only
        run: |
          python3 -m unittest discover -s Tools/ci/tests -v
          python3 Tools/ci/check_mediapipe_only.py
      - name: Manual editor validation pending
        run: echo "This workflow does not compile Unity C# or test webcam hardware."
